name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Confirm release version matches package
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$packageVersion"
          }
      - name: Build installer
        run: npm run build:win
      - name: Create release and upload installer with SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $builtInstaller = "dist/Vortex Launcher Setup $packageVersion.exe"
          if (!(Test-Path -LiteralPath $builtInstaller)) {
            throw "Installer not found: $builtInstaller"
          }
          $installer = "dist/Vortex.Launcher.Setup.$packageVersion.exe"
          Copy-Item -LiteralPath $builtInstaller -Destination $installer
          $checksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumFile = "${installer}.sha256"
          [System.IO.File]::WriteAllText($checksumFile, $checksum)

          gh release create $env:GITHUB_REF_NAME $installer $checksumFile --verify-tag --title "Vortex Place Launcher $env:GITHUB_REF_NAME" --generate-notes
