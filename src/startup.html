<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c11" />
    <title>Vortex Launcher</title>
    <style>
      * { box-sizing: border-box; }
      :root { color-scheme: dark; font-family: "Segoe UI", "Inter", sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0c11; color: #f4f2fa; }
      body { border: 1px solid rgba(190, 169, 255, .22); -webkit-app-region: drag; }
      main { position: relative; display: flex; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 26px 38px 24px; overflow: hidden; background: radial-gradient(ellipse at 50% -20%, rgba(136, 101, 230, .28), transparent 55%), linear-gradient(145deg, #14121c, #0c0d13 68%); }
      main::before, main::after { position: absolute; width: 300px; height: 130px; border: 1px solid rgba(183, 158, 255, .08); border-radius: 50%; content: ""; transform: rotate(-23deg); pointer-events: none; }
      main::before { right: -185px; bottom: -55px; }
      main::after { right: -165px; bottom: -38px; width: 260px; height: 105px; }

      .brand { display: flex; align-items: center; gap: 12px; }
      .brand img { width: 44px; height: 37px; object-fit: contain; }
      .brand-logo { width: 44px; height: 37px; flex: 0 0 auto; }
      .brand-copy { display: grid; gap: 4px; }
      .brand-copy strong { font-size: 15px; letter-spacing: .19em; }
      .brand-copy small { color: #898395; font-size: 8px; font-weight: 700; letter-spacing: .2em; }

      h1 { margin: 24px 0 6px; font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
      .subtitle { margin: 0; color: #97939f; font-size: 10.5px; }

      /* Status card with an integrated progress bar pinned to its bottom. */
      .status-card { position: relative; display: flex; width: 100%; align-items: center; gap: 13px; margin-top: 22px; padding: 13px 15px 15px; border: 1px solid rgba(190, 169, 255, .15); border-radius: 12px; background: linear-gradient(110deg, rgba(155, 124, 255, .09), rgba(255,255,255,.025)); overflow: hidden; }


      .status-copy { display: grid; min-width: 0; gap: 4px; }
      .status-copy strong { color: #eae5f6; font-size: 10.5px; font-weight: 650; }
      .status-copy small { overflow: hidden; color: #9b95a6; font-size: 9.5px; text-overflow: ellipsis; white-space: nowrap; }

      .status-card.failed { border-color: rgba(224,112,95,.35); }
      .status-card.failed .status-copy small { color: #e0a496; }

      /* Progress lives INSIDE the card: a hairline track along its bottom. */
      .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.07); }
      .progress i { display: block; width: 30%; height: 100%; background: linear-gradient(90deg, #7251ce, #c4afff); animation: load 1.6s ease-in-out infinite; }
      .progress.downloading i, .progress.applying i { animation: none; transition: width .25s ease; }

      .version { margin-top: 12px; color: #6d6878; font-size: 8.5px; letter-spacing: .06em; }

      /* Multi-stage checklist shown while an update runs. */
      .stages { display: grid; gap: 5px; width: 100%; margin: 12px 0 0; padding: 0; list-style: none; }
      .stages li { display: flex; align-items: center; gap: 9px; color: #6f6a7c; font-size: 9.5px; letter-spacing: .01em; transition: color .25s ease; }
      .stages li i { display: grid; width: 14px; height: 14px; flex: 0 0 auto; place-items: center; border: 1px solid rgba(190,169,255,.22); border-radius: 50%; background: rgba(255,255,255,.02); transition: border-color .25s ease, background .25s ease; }
      .stages li i::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: transparent; transition: background .25s ease; }
      .stages li.active { color: #eae5f6; }
      .stages li.active i { border-color: #a58aff; background: rgba(155,124,255,.16); }
      .stages li.active i::before { background: #c4afff; }
      .stages li.done { color: #9b93ad; }
      .stages li.done i { border-color: rgba(114,81,206,.55); background: rgba(114,81,206,.18); }
      .stages li.done i::before { content: ""; width: 8px; height: 4px; border: 1.5px solid #8fd6a8; border-top: 0; border-right: 0; border-radius: 0; background: none; transform: rotate(-45deg) translate(0, -1px); }
      .stages li.error { color: #e0a496; }
      .stages li.error i { border-color: rgba(224,112,95,.45); background: rgba(224,112,95,.12); }
      .stages li.error i::before { background: #e0705f; }
      @keyframes load { 0% { transform: translateX(-110%); } 100% { transform: translateX(430%); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>

      <h1 data-copy="title">Запускаем Vortex</h1>
      <p class="subtitle" data-copy="subtitle">Подготавливаем каталог и проверяем обновления</p>
      <section class="status-card" id="status-card" aria-live="polite">
        <span class="status-copy"><strong data-copy="startup">Подготовка лаунчера</strong><small id="updates-copy">Проверяем обновления…</small></span>
        <div class="progress" aria-hidden="true"><i></i></div>
      </section>
      <ol class="stages" id="stages" hidden>
        <li data-stage="checksum"><i></i><span>Контрольная сумма</span></li>
        <li data-stage="prepare"><i></i><span>Подготовка к загрузке</span></li>
        <li data-stage="downloading"><i></i><span>Загрузка установщика</span></li>
        <li data-stage="verify"><i></i><span>Проверка установщика</span></li>
        <li data-stage="installing"><i></i><span>Установка новой версии</span></li>
      </ol>
      <small class="version" id="version-copy">VORTEX · PLACE LAUNCHER</small>
    </main>
    <script>
      const copy = {
        ru: { title: 'Открываем каталог', subtitle: 'Подготавливаем каталог и проверяем обновления', startup: 'Подготовка лаунчера', checking: 'Проверяем доступные версии', current: 'Установлена актуальная версия', unavailable: 'Пока нет опубликованных обновлений', downloading: 'Загружаем обновление', downloaded: 'Обновление загружено и проверено', applying: 'Устанавливаем обновление — лаунчер перезапустится', error: 'Не удалось обновиться — запускаем текущую версию', development: 'Проверка обновлений доступна в установленной версии', version: 'Текущая версия {version}', waiting: 'Загрузка идёт, это может занять минуту' },
        en: { title: 'Opening your library', subtitle: 'Preparing your library and checking for updates', startup: 'Preparing the launcher', checking: 'Checking for available versions', current: 'You have the latest version', unavailable: 'No published updates yet', downloading: 'Downloading the update', downloaded: 'Update downloaded and verified', applying: 'Installing update — the launcher will restart', error: 'Update failed — opening the current version', development: 'Update checks run in the installed app', version: 'Current version {version}', waiting: 'Downloading, this can take a minute' }
      };
      const stageOrder = ['checksum', 'prepare', 'downloading', 'verify', 'installing'];
      const language = navigator.language.toLowerCase().startsWith('ru') ? 'ru' : 'en';
      document.documentElement.lang = language;
      document.querySelectorAll('[data-copy]').forEach((node) => { node.textContent = copy[language][node.dataset.copy]; });
      const statusCard = document.getElementById('status-card');
      const updateCopy = document.getElementById('updates-copy');
      const versionCopy = document.getElementById('version-copy');
      const progress = document.querySelector('.progress');
      const stagesList = document.getElementById('stages');
      let waitingHintShown = false;
      let currentState = { status: 'checking' };
      const BUSY = ['checking', 'downloading', 'applying'];
      function renderStages() {
        const stage = currentState.stage || null;
        const failed = currentState.status === 'error';
        const stageIndex = stage ? stageOrder.indexOf(stage) : -1;
        const active = ['downloading', 'applying'].includes(currentState.status);
        stagesList.hidden = !stage || !['downloading', 'applying', 'error'].includes(currentState.status);
        if (stagesList.hidden) return;
        for (const item of stagesList.querySelectorAll('li')) {
          const name = item.dataset.stage;
          const index = stageOrder.indexOf(name);
          item.classList.toggle('done', !failed && index < stageIndex);
          item.classList.toggle('active', !failed && name === stage);
          item.classList.toggle('error', failed && name === stage);
        }
        if (currentState.status === 'applying') {
          for (const item of stagesList.querySelectorAll('li')) {
            item.classList.remove('error');
            item.classList.add('done');
          }
          stagesList.querySelector('li[data-stage="installing"]').classList.replace('done', 'active');
        }
      }
      function render() {
        const status = currentState.status || 'checking';
        const key = ['current', 'unavailable', 'downloading', 'downloaded', 'applying', 'error', 'development'].includes(status) ? status : 'checking';
        const percent = Math.max(0, Math.min(100, Number(currentState.progress) || 0));
        const suffix = key === 'downloading' && Number.isFinite(currentState.progress) ? ` · ${percent}%` : '';
        updateCopy.textContent = waitingHintShown && key === 'checking' ? `${copy[language].waiting}${suffix}` : `${copy[language][key]}${suffix}`;        statusCard.classList.toggle('failed', status === 'error');
        progress.classList.toggle('downloading', key === 'downloading' || key === 'applying');
        if (key === 'downloading' || key === 'applying') {
          progress.querySelector('i').style.width = `${key === 'applying' ? 100 : Math.max(1, percent)}%`;
        }
        if (currentState.currentVersion) versionCopy.textContent = copy[language].version.replace('{version}', currentState.currentVersion);
        renderStages();
      }
      function showUpdateState(state) {
        if (state) currentState = state;
        if (currentState.status === 'downloading' || currentState.status === 'applying') waitingHintShown = false;
        render();
      }
      window.vortexStartup?.onUpdateState?.(showUpdateState);
      setTimeout(() => {
        if (currentState.status !== 'checking') return;
        waitingHintShown = true;
        render();
      }, 10000);
      window.vortexStartup?.getUpdateState?.().then(showUpdateState).catch(() => {});
      // Match splash language to stage labels.
      if (language === 'en') {
        document.querySelector('[data-stage="checksum"] span').textContent = 'Checksum';
        document.querySelector('[data-stage="prepare"] span').textContent = 'Preparing';
        document.querySelector('[data-stage="downloading"] span').textContent = 'Downloading installer';
        document.querySelector('[data-stage="verify"] span').textContent = 'Verifying installer';
        document.querySelector('[data-stage="installing"] span').textContent = 'Installing new version';
      }
    </script>
