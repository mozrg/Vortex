<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://*.rbxcdn.com data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'" />
  <title>Vortex</title>
  <link rel="stylesheet" href="./tray.css" />
  <script src="./js/tray.js" defer></script>
</head>
<body>
  <main class="tray-shell">
    <div class="tray-now-playing" id="tray-now-playing" hidden>
      <span class="tray-now-art" id="tray-now-art"></span><span class="tray-now-copy"><strong id="tray-now-title"></strong><small id="tray-now-time"></small></span><span class="tray-now-live" aria-hidden="true"></span>
    </div>
    <div class="tray-content">
      <section class="tray-section" aria-labelledby="favorite-heading">
        <div class="tray-section-heading"><button class="tray-collapse" type="button" data-tray-collapse="favorites" aria-expanded="true" aria-label="Свернуть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></button><h2 id="favorite-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.9c0 4.2-8.8 10.2-8.8 10.2S3.2 13.1 3.2 8.9a4.2 4.2 0 0 1 7.5-2.6L12 7.8l1.3-1.5a4.2 4.2 0 0 1 7.5 2.6Z" /></svg><span data-copy="favorites">Избранное</span></h2><small data-favorite-count>0 / 5</small></div>
        <div class="tray-list" id="tray-favorites"></div>
      </section>
      <section class="tray-section" aria-labelledby="quick-heading">
        <div class="tray-section-heading"><button class="tray-collapse" type="button" data-tray-collapse="quick" aria-expanded="true" aria-label="Свернуть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></button><h2 id="quick-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 12 7-12 7z" /><path d="M4 4v16" /></svg><span data-copy="quick">Быстрый запуск</span></h2><small data-quick-count>0 / 3</small></div>
        <div class="tray-list" id="tray-quick-launch"></div>
      </section>
    </div>
    <footer class="tray-footer">
      <button class="tray-footer-button tray-open-button" type="button" data-tray-action="open"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-5v-7H9v7H5a2 2 0 0 1-2-2z" /></svg><span data-copy="open">Открыть Vortex</span></button>
      <button class="tray-footer-button tray-quit-button" type="button" data-tray-action="quit" aria-label="Закрыть Vortex полностью"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5" /><path d="m16 17 5-5-5-5m5 5H9" /></svg><span data-copy="quit">Выход</span></button>
    </footer>
    <div class="tray-toast" id="tray-toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
