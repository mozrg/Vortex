<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://*.rbxcdn.com data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'" />
  <title>Vortex</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="./tray.css" />
  <link rel="stylesheet" href="./overlays.css" />
  <script src="./js/icons.js" defer></script>
  <script src="./js/overlays.js" defer></script>
  <script src="./js/tray.js" defer></script>
  <link rel="stylesheet" href="./motion.css" />
  <script src="./js/motion.js" defer></script>
</head>
<body>
  <main class="tray-shell">
    <header class="tray-brand"><img src="./assets/vortex-logo.svg" alt="" />Vortex</header>
    <div class="tray-now-playing" id="tray-now-playing" hidden>
      <span class="tray-now-art" id="tray-now-art"></span>
      <span class="tray-now-copy">
        <strong id="tray-now-title"></strong>
        <small><i class="tray-now-live" aria-hidden="true"></i><span id="tray-now-time"></span></small>
      </span>
      <div class="tray-now-actions" role="group" aria-label="Управление текущей сессией">
        <button class="tray-session-btn" type="button" data-tray-session="session-invite" data-icon="link"></button>
        <button class="tray-session-btn" type="button" data-tray-session="session-hop" data-icon="refreshCw"></button>
        <button class="tray-session-btn" type="button" data-tray-session="session-rejoin" data-icon="rotate"></button>
        <button class="tray-session-btn" type="button" data-tray-session="session-mute" data-icon="bell"></button>
      </div>
    </div>
    <div class="tray-content">
      <section class="tray-section" aria-labelledby="favorite-heading">
        <div class="tray-section-heading"><button class="tray-collapse" type="button" data-tray-collapse="favorites" aria-expanded="true" aria-label="Свернуть" data-icon="chevronDown"></button><h2 id="favorite-heading"><span class="tray-glyph" data-icon="star"></span><span data-copy="favorites">Избранное</span></h2><small data-favorite-count>0 / 5</small></div>
        <div class="tray-list" id="tray-favorites"></div>
      </section>
      <section class="tray-section" aria-labelledby="quick-heading">
        <div class="tray-section-heading"><button class="tray-collapse" type="button" data-tray-collapse="quick" aria-expanded="true" aria-label="Свернуть" data-icon="chevronDown"></button><h2 id="quick-heading"><span class="tray-glyph" data-icon="rocket"></span><span data-copy="quick">Быстрый запуск</span></h2><small data-quick-count>0 / 3</small></div>
        <div class="tray-list" id="tray-quick-launch"></div>
      </section>
    </div>
    <footer class="tray-footer">
      <button class="tray-footer-button tray-open-button" type="button" data-tray-action="open"><span class="tray-glyph" data-icon="windowOpen"></span><span data-copy="open">Открыть Vortex</span></button>
      <button class="tray-footer-button tray-quit-button" type="button" data-tray-action="quit" aria-label="Закрыть Vortex полностью"><span class="tray-glyph" data-icon="doorOut"></span><span data-copy="quit">Выход</span></button>
    </footer>
    <div class="tray-toast" id="tray-toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
