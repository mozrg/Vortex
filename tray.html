<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' https://tr.rbxcdn.com data:;" />
  <title>Vortex  Трей</title>
  <style>
    :root {
      --bg: #0b0c10;
      --surface: #111319;
      --surface-2: #171922;
      --line: rgba(255,255,255,.075);
      --line-strong: rgba(255,255,255,.13);
      --text: #f4f4f6;
      --muted: #8d909e;
      --accent: #9b7cff;
      --accent-rgb: 155, 124, 255;
      --accent-secondary: #c274ec;
      --accent-border: rgba(155, 124, 255, .38);
      --accent-wash: rgba(155, 124, 255, .14);
      --accent-text: #c3b2ff;
      --accent-fill: #9b7cff;
      --accent-contrast: #ffffff;
      --radius: 18px;
      --scale: 1;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: transparent; font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; font-size: calc(14px * var(--scale)); letter-spacing: -.01em; }
    body.sharp { --radius: 3px; }
    .tray-panel { position: relative; display: flex; flex-direction: column; gap: calc(12px * var(--scale)); width: 316px; height: 436px; padding: calc(18px * var(--scale)) calc(16px * var(--scale)) calc(16px * var(--scale)); overflow: hidden; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); box-shadow: inset 0 1px rgba(255,255,255,.05), 0 24px 60px rgba(0,0,0,.5); }
    .tray-panel::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 90% 40% at 50% -10%, rgba(var(--accent-rgb), .14), transparent 70%); pointer-events: none; }
    .tray-head { position: relative; display: flex; align-items: center; gap: calc(11px * var(--scale)); }
    .tray-logo { display: grid; width: calc(38px * var(--scale)); height: calc(38px * var(--scale)); flex: 0 0 auto; place-items: center; border: 1px solid var(--accent-border); border-radius: calc(11px * var(--scale) * .61); background: var(--accent-wash); color: var(--accent-text); }
    .tray-logo svg { width: calc(20px * var(--scale)); height: calc(20px * var(--scale)); }
    .tray-copy strong { display: block; font-size: calc(13px * var(--scale)); letter-spacing: -.03em; }
    .tray-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: calc(9px * var(--scale)); letter-spacing: .05em; }
    .tray-section-title { position: relative; margin: 2px 0 0; color: var(--muted); font-size: calc(9px * var(--scale)); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .tray-games { position: relative; display: grid; flex: 1; gap: calc(6px * var(--scale)); align-content: start; overflow-y: auto; scrollbar-width: none; }
    .tray-games::-webkit-scrollbar { display: none; }
    .tray-game { display: flex; align-items: center; gap: calc(10px * var(--scale)); width: 100%; min-height: calc(44px * var(--scale)); padding: calc(7px * var(--scale)) calc(9px * var(--scale)); border: 1px solid var(--line); border-radius: calc(11px * var(--scale) * .61); background: var(--surface-2); color: var(--text); text-align: left; cursor: pointer; transition: border-color .16s ease, background .16s ease, color .16s ease; }
    .tray-game:hover { border-color: var(--accent-border); background: var(--accent-wash); }
    .tray-game svg { width: calc(14px * var(--scale)); height: calc(14px * var(--scale)); flex: 0 0 auto; margin-left: auto; color: var(--accent-text); }
    .tray-game strong { display: block; overflow: hidden; max-width: 190px; font-size: calc(11px * var(--scale)); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .tray-game small { display: block; margin-top: 2px; color: var(--muted); font-size: calc(8px * var(--scale)); }
    .tray-empty { position: relative; display: grid; flex: 1; align-content: center; justify-items: center; gap: 8px; color: var(--muted); font-size: calc(10px * var(--scale)); text-align: center; line-height: 1.6; }
    .tray-empty svg { width: calc(22px * var(--scale)); height: calc(22px * var(--scale)); color: var(--accent-text); }
    .tray-actions { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: calc(8px * var(--scale)); }
    .tray-button { display: inline-flex; align-items: center; justify-content: center; gap: calc(7px * var(--scale)); min-height: calc(36px * var(--scale)); padding: 0 calc(12px * var(--scale)); border: 1px solid var(--line-strong); border-radius: calc(10px * var(--scale) * .61); background: rgba(255,255,255,.03); color: var(--text); font-size: calc(10px * var(--scale)); font-weight: 600; cursor: pointer; transition: .16s ease; }
    .tray-button:hover { border-color: var(--accent-border); background: var(--accent-wash); color: var(--accent-text); }
    .tray-button.primary { border-color: var(--accent-border); background: var(--accent-fill); color: var(--accent-contrast); }
    .tray-button.primary:hover { border-color: var(--accent-border); filter: brightness(1.1); }
    .tray-button svg { width: calc(13px * var(--scale)); height: calc(13px * var(--scale)); }
    .tray-button.danger:hover { border-color: rgba(239, 98, 111, .5); background: rgba(239, 98, 111, .12); color: #ff8f9b; }
    body.sharp .tray-game, body.sharp .tray-button, body.sharp .tray-logo { border-radius: 2px; }
  </style>
</head>
<body>
  <div class="tray-panel">
    <div class="tray-head">
      <span class="tray-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
      <div class="tray-copy"><strong>Vortex</strong><small data-i18n="tray.status">ТТ  </small></div>
    </div>
    <p class="tray-section-title" data-i18n="tray.recent">оследние игры</p>
    <div class="tray-games" id="tray-games"></div>
    <div class="tray-actions">
      <button class="tray-button primary" id="tray-open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span data-i18n="tray.open">ткрыть приложение</span>
      </button>
      <button class="tray-button danger" id="tray-quit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        <span data-i18n="tray.quit">акрыть полностью</span>
      </button>
    </div>
  </div>
  <script>
    const translations = {
      ru: {
        'tray.status': 'ТТ  ',
        'tray.recent': 'оследние игры',
        'tray.open': 'ткрыть приложение',
        'tray.quit': 'акрыть полностью',
        'tray.launch': 'апустить',
        'tray.empty': 'ока пусто  запусти игру,<br />и она появится здесь'
      },
      en: {
        'tray.status': 'RUNNING IN BACKGROUND',
        'tray.recent': 'Recent games',
        'tray.open': 'Open app',
        'tray.quit': 'Quit completely',
        'tray.launch': 'Launch',
        'tray.empty': 'Nothing yet  launch a game<br />and it will show up here'
      }
    };
    let language = 'ru';

    const hexToRgb = (hex) => {
      const normalized = /^#[0-9a-f]{6}$/i.test(String(hex)) ? String(hex) : '#000000';
      return [1, 3, 5].map((index) => parseInt(normalized.slice(index, index + 2), 16));
    };
    const relativeLuminance = (hex) => {
      const [red, green, blue] = hexToRgb(hex).map((channel) => {
        const scaled = channel / 255;
        return scaled <= 0.03928 ? scaled / 12.92 : ((scaled + 0.055) / 1.055) ** 2.4;
      });
      return 0.2126 * red + 0.7152 * green + 0.0722 * blue;
    };
    const mixHex = (first, second, amount) => {
      const a = hexToRgb(first);
      const b = hexToRgb(second);
      return '#' + a.map((channel, index) => Math.round(channel + (b[index] - channel) * amount).toString(16).padStart(2, '0')).join('');
    };

    // Applies the launcher's appearance settings: accent, theme, custom colors,
    // gradient fill and corner style all follow the main window.
    function applyStyle(style) {
      if (!style || typeof style !== 'object') return;
      language = ['ru', 'en'].includes(style.language) ? style.language : 'ru';
      const root = document.documentElement.style;
      const accent = /^#[0-9a-f]{6}$/i.test(String(style.accent)) ? String(style.accent) : '#9b7cff';
      const accentSecondary = /^#[0-9a-f]{6}$/i.test(String(style.accentSecondary)) ? String(style.accentSecondary) : '#c274ec';
      const channels = hexToRgb(accent).join(', ');
      const themeBase = {
        dark: { background: '#0b0c10', surface: '#111319' },
        light: { background: '#f2f1f6', surface: '#ffffff' },
        oled: { background: '#030305', surface: '#08090c' }
      }[style.theme] || { background: '#0b0c10', surface: '#111319' };
      const background = /^#[0-9a-f]{6}$/i.test(String(style.themeBackground)) ? String(style.themeBackground) : themeBase.background;
      const isLightCanvas = relativeLuminance(background) > 0.42;
      const derivedSurface = /^#[0-9a-f]{6}$/i.test(String(style.themeBackground))
        ? mixHex(background, isLightCanvas ? '#ffffff' : '#000000', isLightCanvas ? 0.78 : 0.48)
        : themeBase.surface;
      const surface = /^#[0-9a-f]{6}$/i.test(String(style.themeSurface)) ? String(style.themeSurface) : derivedSurface;
      const gradientAngle = Math.max(0, Math.min(360, Number(style.gradientAngle) || 135));
      const accentText = /^#[0-9a-f]{6}$/i.test(String(style.accentText)) ? String(style.accentText) : accent;
      const accentWash = style.accentMode === 'gradient'
        ? `linear-gradient(${gradientAngle}deg, rgba(${channels}, .19), rgba(${hexToRgb(accentSecondary).join(', ')}, .12))`
        : `rgba(${channels}, .14)`;
      const fill = style.accentMode === 'gradient'
        ? `linear-gradient(${gradientAngle}deg, ${accent}, ${accentSecondary})`
        : accent;
      const contrast = (foreground) => {
        const a = relativeLuminance(foreground);
        const b = relativeLuminance(accent);
        return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
      };
      const accentContrast = contrast('#ffffff') >= contrast('#17151d') ? '#ffffff' : '#17151d';
      root.setProperty('--accent', accent);
      root.setProperty('--accent-rgb', channels);
      root.setProperty('--accent-secondary', accentSecondary);
      root.setProperty('--accent-border', `rgba(${channels}, .38)`);
      root.setProperty('--accent-wash', accentWash);
      root.setProperty('--accent-text', accentText);
      root.setProperty('--accent-fill', fill);
      root.setProperty('--accent-contrast', accentContrast);
      root.setProperty('--bg', background);
      root.setProperty('--surface', surface);
      root.setProperty('--surface-2', mixHex(surface, background, 0.42));
      root.setProperty('--text', isLightCanvas ? '#211e2a' : '#f4f4f6');
      root.setProperty('--muted', isLightCanvas ? '#777382' : '#8d909e');
      root.setProperty('--line', isLightCanvas ? 'rgba(38,32,56,.1)' : 'rgba(255,255,255,.075)');
      root.setProperty('--line-strong', isLightCanvas ? 'rgba(38,32,56,.22)' : 'rgba(255,255,255,.13)');
      root.setProperty('--scale', String({ compact: 0.9, normal: 1, large: 1.1 }[style.trayScale] || 1));
      document.body.classList.toggle('sharp', style.corners === 'sharp');
      document.body.classList.toggle('light-theme', isLightCanvas);
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        const key = node.dataset.i18n;
        node.innerHTML = (translations[language] || translations.ru)[key] || node.innerHTML;
      });
      render(window.__games || []);
    }

    const playIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 14 8-14 8z"/></svg>';
    const gamesList = document.getElementById('tray-games');
    const strings = (key) => (translations[language] || translations.ru)[key] || key;
    function render(games) {
      window.__games = games || [];
      gamesList.innerHTML = window.__games.length
        ? window.__games.map((game) => `<button class="tray-game" data-launch="${game.id}">
            <span><strong>${game.title}</strong><small>${strings('tray.launch')}</small></span>
            ${playIcon}
          </button>`).join('')
        : `<div class="tray-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="3"/><path d="m16 3-4 4-4-4"/><path d="m10 12 5 2.5-5 2.5z"/></svg>
            ${strings('tray.empty')}
          </div>`;
    }
    window.vortexTray.onGames((games, style) => { if (style) applyStyle(style); render(games); });
    Promise.all([window.vortexTray.getGames(), window.vortexTray.getStyle()]).then(([games, style]) => {
      applyStyle(style);
      render(games);
    }).catch(() => render([]));
    document.getElementById('tray-open').addEventListener('click', () => window.vortexTray.openApp());
    document.getElementById('tray-quit').addEventListener('click', () => window.vortexTray.quitApp());
    document.addEventListener('click', (event) => {
      const launch = event.target.closest('[data-launch]');
      if (launch) window.vortexTray.launchGame(launch.dataset.launch);
    });
    // Clicking the transparent margin around the panel closes the tray,
    // mirroring how native tray menus dismiss on an outside click.
    document.addEventListener('pointerdown', (event) => {
      if (event.target.closest('.tray-panel')) return;
      window.vortexTray.dismiss();
    });
  </script>
</body>
</html>
